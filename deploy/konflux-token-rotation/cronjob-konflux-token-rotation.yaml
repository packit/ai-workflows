---
# Runs IN kflux-rhel-p01/ymir-tenant as the non-bot minter SA. Its pod receives
# a kubelet-projected token automatically (no stored credential, no refresh
# chain to break), uses it to mint a fresh short-lived token for konflux-bot-0
# via the TokenRequest API, and writes that token into a Secret.
#
# Schedule is cap/2: tokens are minted with --duration=24h, rotated every 12h,
# so a single missed run still leaves a valid token. If the cluster caps token
# lifetime below 24h, the requested duration is silently clamped -- shorten the
# schedule to match (see README).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: konflux-token-rotation
  namespace: ymir-tenant
spec:
  schedule: "0 */12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: ymir-token-minter
          restartPolicy: Never
          containers:
            - name: rotate
              # Any image with kubectl + in-cluster config. ose-cli ships `oc`
              # (a kubectl superset). Pin a digest in production.
              image: registry.redhat.io/openshift4/ose-cli:latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  # Mint a fresh 24h token for konflux-bot-0 (authn = this pod's
                  # kubelet-projected ymir-token-minter identity).
                  TOKEN="$(oc create token konflux-bot-0 -n ymir-tenant --duration=24h)"
                  if [ -z "${TOKEN}" ]; then
                    echo "ERROR: minted an empty token" >&2
                    exit 1
                  fi
                  echo "Minted konflux-bot-0 token, length ${#TOKEN}"
                  # Deliver: upsert the consuming Secret. See README "Delivery"
                  # for the cross-cluster case (gateway in jotnar-ymir).
                  oc create secret generic konflux-bot-0-token \
                    -n ymir-tenant \
                    --from-literal=token="${TOKEN}" \
                    --dry-run=client -o yaml | oc apply -f -
                  echo "Delivered token to secret/konflux-bot-0-token in ymir-tenant"
