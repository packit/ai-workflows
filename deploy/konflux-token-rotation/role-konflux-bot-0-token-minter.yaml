---
# Namespaced Role granting ONLY the ability to mint a token for konflux-bot-0
# via the TokenRequest API (create on the serviceaccounts/token subresource,
# restricted by resourceNames to the single target SA). Nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: konflux-bot-0-token-minter
  namespace: ymir-tenant
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["konflux-bot-0"]
    verbs: ["create"]
