---
# Binds the non-bot minter SA to the token-minting Role above.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ymir-token-minter-can-mint-konflux-bot-0
  namespace: ymir-tenant
subjects:
  - kind: ServiceAccount
    name: ymir-token-minter
    namespace: ymir-tenant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: konflux-bot-0-token-minter
