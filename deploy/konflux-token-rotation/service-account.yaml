---
# Dedicated NON-bot minter identity. It is deliberately NOT named
# `konflux-bot-*`, so the ValidatingAdmissionPolicy
# `konflux-rbac-restrict-bindings-serviceaccounts-create.konflux-ci.dev`
# (which forbids binding konflux-bot-* SAs to namespaced Roles) does not apply
# to it. This is what lets us grant it the token-minting Role below -- a grant
# that konflux-bot-0 itself can never hold.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ymir-token-minter
  namespace: ymir-tenant
  annotations:
    ymir-tenant.konflux-ci.dev/scope: "Mints short-lived konflux-bot-0 API tokens"
  labels:
    ymir-tenant.konflux-ci.dev/service: "ymir"
