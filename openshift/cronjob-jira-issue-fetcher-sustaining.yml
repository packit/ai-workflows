apiVersion: batch/v1
kind: CronJob
metadata:
  name: jira-issue-fetcher-sustaining
  labels:
    app: jira-issue-fetcher-sustaining
    component: scheduler
spec:
  # Every 15 minutes — tops up triage_queue_sustaining toward
  # QUEUE_DEPTH_THRESHOLD. Suspended until routing is enabled; flip to false
  # together with scaling up the sustaining agent deployments.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid  # Prevent overlapping runs
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  suspend: true
  jobTemplate:
    metadata:
      labels:
        app: jira-issue-fetcher-sustaining
        component: job
        billing-bucket: sustaining
      spec:
        backoffLimit: 2
        activeDeadlineSeconds: 600
        template:
          metadata:
            labels:
              app: jira-issue-fetcher-sustaining
              component: pod
              billing-bucket: sustaining
          spec:
            restartPolicy: Never
            containers:
            - name: jira-issue-fetcher-env
              image: 'jira-issue-fetcher:prod'
              imagePullPolicy: IfNotPresent
              env:
              # Deployment-scoped bucket: this fetcher feeds the sustaining
              # queue family and reads sustaining queue depths only.
              - name: SUSTAINING
                value: "true"
              envFrom:
              - configMapRef:
                  name: endpoints-env
              - configMapRef:
                  name: jira-env
              - secretRef:
                  name: jira-env
              - configMapRef:
                  name: jira-issue-fetcher-env
              - configMapRef:
                  name: jira-issue-fetcher-filter-env-sustaining
              resources:
                limits:
                  cpu: "200m"
                  memory: "128Mi"
                requests:
                  cpu: "20m"
                  memory: "64Mi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                  - ALL
              volumeMounts:
              - mountPath: /etc/pki/service-ca
                name: service-ca
                readOnly: true
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            dnsPolicy: ClusterFirst
            schedulerName: default-scheduler
            terminationGracePeriodSeconds: 30
            volumes:
            - name: service-ca
              configMap:
                name: service-ca-bundle
