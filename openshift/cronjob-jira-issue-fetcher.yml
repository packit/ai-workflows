apiVersion: batch/v1
kind: CronJob
metadata:
  name: jira-issue-fetcher
  labels:
    app: jira-issue-fetcher
    component: scheduler
spec:
  # Every 15 minutes — tops up the triage queue toward QUEUE_DEPTH_THRESHOLD.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid  # Prevent overlapping runs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  suspend: false
  jobTemplate:
    metadata:
      labels:
        app: jira-issue-fetcher
        component: job
    spec:
      backoffLimit: 2
      # 10 minutes max runtime — a runaway-job safety net, not overlap
      # prevention (concurrencyPolicy: Forbid already handles that). Must
      # comfortably exceed _make_request_with_retries' worst case (4 attempts
      # x 90s timeout plus backoff, ~6 minutes) so a genuinely slow Jira call
      # can finish or fail on its own instead of being killed mid-retry.
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: jira-issue-fetcher
            component: pod
        spec:
          restartPolicy: Never
          containers:
          - name: jira-issue-fetcher-env
            image: 'jira-issue-fetcher:prod'
            imagePullPolicy: IfNotPresent
            envFrom:
            - configMapRef:
                name: endpoints-env
            - configMapRef:
                name: jira-env
            - secretRef:
                name: jira-env
            - configMapRef:
                name: jira-issue-fetcher-env
            - configMapRef:
                name: jira-issue-fetcher-filter-env
            resources:
              limits:
                cpu: "200m"
                memory: "128Mi"
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                - ALL
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          dnsPolicy: ClusterFirst
          schedulerName: default-scheduler
          terminationGracePeriodSeconds: 30
