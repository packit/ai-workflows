apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mcp-gateway
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mcp-gateway
        deployment: mcp-gateway
    spec:
      containers:
      - args:
        - -m
        - ymir.tools.privileged.gateway
        command:
        - /opt/beeai-venv/bin/python
        env:
        - name: GIT_REPO_BASEPATH
          valueFrom:
            configMapKeyRef:
              key: GIT_REPO_BASEPATH
              name: agents-env
        - name: SSE_PORT
          value: "8000"
        - name: FORK_NAMESPACE
          value: redhat/rhel/bot-branches
        # Kill switch: set to "false" to have get_shared_rules return an
        # empty list without contacting the shared-rules registry.
        - name: SHARED_RULES_ENABLED
          value: "true"
        - name: REQUESTS_CA_BUNDLE
          value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
        # --- Konflux build backend ---
        # Builds run on kflux-rhel-p01 as konflux-bot-0 (ymir-tenant). The
        # namespace/SA/image-repo defaults are baked into konflux.py.
        - name: BUILD_BACKEND
          value: konflux
        - name: KONFLUX_API_URL
          value: https://api.kflux-rhel-p01.fc38.p1.openshiftapps.com:6443
        - name: KUBEARCHIVE_API_URL
          value: https://kubearchive-api-server-product-kubearchive.apps.kflux-rhel-p01.fc38.p1.openshiftapps.com
        - name: KONFLUX_PIPELINE_URL
          value: https://gitlab.cee.redhat.com/rhel-on-konflux/rpmbuild-pipeline.git
        # Read fresh per build from the rotated konflux-bot-0-token Secret
        # (see openshift/README.md). GITLAB_TOKEN comes from gitlab-env.
        - name: KONFLUX_TOKEN_FILE
          value: /home/mcp/konflux/token
        envFrom:
        - secretRef:
            name: gitlab-env
        - secretRef:
            name: github-readonly-env
        - configMapRef:
            name: jira-env
        - secretRef:
            name: jira-env
        - configMapRef:
            name: kerberos-env
        # Required by Testing Farm MCP tools (used by reproducer agent).
        - secretRef:
            name: testing-farm-env
        image: mcp-server:prod
        imagePullPolicy: IfNotPresent
        name: mcp-gateway
        ports:
        - containerPort: 8000
          protocol: TCP
        resources:
          limits:
            cpu: "200m"
            memory: 2Gi
          requests:
            memory: 1Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /git-repos  # NOTE: This path must match GIT_REPO_BASEPATH in configmap/agents-env
          name: mcp-server-git-repos
        - mountPath: /etc/secrets/redhat-ymir-agent.keytab
          name: redhat-ymir-agent-keytab
          subPath: redhat-ymir-agent.keytab
        - mountPath: /home/mcp/rhel-config.json
          name: rhel-config
          subPath: rhel-config.json
        # No subPath: subPath mounts are NOT refreshed on Secret rotation,
        # which would freeze the token. Mount the dir so rotation propagates.
        - mountPath: /home/mcp/konflux
          name: konflux-bot-0-token
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: mcp-server-git-repos
        persistentVolumeClaim:
          claimName: mcp-server-git-repos
      - name: redhat-ymir-agent-keytab
        secret:
          secretName: redhat-ymir-agent-keytab  # pragma: allowlist secret
      - name: rhel-config
        configMap:
          name: rhel-config
      # Rotated by the konflux-token-rotation CronJob (kflux-rhel-p01).
      - name: konflux-bot-0-token
        secret:
          secretName: konflux-bot-0-token  # pragma: allowlist secret
