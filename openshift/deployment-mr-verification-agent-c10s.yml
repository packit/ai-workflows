apiVersion: apps/v1
kind: Deployment
metadata:
  name: mr-verification-agent-c10s
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mr-verification-agent-c10s
  # Recreate, not RollingUpdate: with replicas=1 a rolling update needs a
  # second pod's worth of quota before the old one is torn down, which
  # deadlocks against the namespace quota.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mr-verification-agent-c10s
        deployment: mr-verification-agent-c10s
    spec:
      containers:
      - args:
        - -m
        - ymir.agents.mr_verification_agent
        command:
        - /usr/bin/python3
        env:
        - name: CONTAINER_VERSION
          value: "c10s"
        - name: REQUESTS_CA_BUNDLE
          value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
        envFrom:
        - configMapRef:
            name: agents-env
        - configMapRef:
            name: chat-env
        - configMapRef:
            name: endpoints-env
        - secretRef:
            name: sentry-env
        image: 'beeai-agent:c10s'
        imagePullPolicy: IfNotPresent
        name: mr-verification-agent-c10s
        ports:
        - containerPort: 8080
          protocol: TCP
        # The reviewer only reads: one shallow-ish clone plus an optional
        # 'rpmbuild -bp'. It never builds an SRPM or runs Copr, so it is
        # sized well below the backport/consolidation agents.
        resources:
          limits:
            cpu: 600m
            memory: 2Gi
          requests:
            cpu: 25m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /git-repos
          name: mcp-server-git-repos
        - mountPath: /home/beeai/rhel-config.json
          name: rhel-config
          subPath: rhel-config.json
        - mountPath: /etc/secrets/jotnar-vertex-prod.json
          name: vertex-key
          subPath: jotnar-vertex-prod.json
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Matches the other agents: run_task_loop re-pushes in-flight tasks to
      # Redis on SIGTERM, so the pod needs a moment to wind down cleanly.
      terminationGracePeriodSeconds: 45
      volumes:
      - name: mcp-server-git-repos
        persistentVolumeClaim:
          claimName: mcp-server-git-repos
      - name: rhel-config
        configMap:
          name: rhel-config
      - name: vertex-key
        secret:
          secretName: vertex-key #pragma: allowlist secret
