apiVersion: apps/v1
kind: Deployment
metadata:
  name: mr-verification-agent
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mr-verification-agent
  # Recreate, not RollingUpdate: with replicas=1 a rolling update needs a
  # second pod's worth of quota before the old one is torn down, which
  # deadlocks against the namespace quota.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mr-verification-agent
        deployment: mr-verification-agent
    spec:
      containers:
      - args:
        - -m
        - ymir.agents.mr_verification_agent
        command:
        - /usr/bin/python3
        env:
        - name: REQUESTS_CA_BUNDLE
          value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
        envFrom:
        - configMapRef:
            name: agents-env
        - configMapRef:
            name: chat-env
        - configMapRef:
            name: endpoints-env
        - secretRef:
            name: sentry-env
        image: 'beeai-agent:c10s'
        imagePullPolicy: IfNotPresent
        name: mr-verification-agent
        ports:
        - containerPort: 8080
          protocol: TCP
        # The agent only reads: CI job logs, plus one clone when it has to
        # attribute a failure. It never builds a package, so it needs no
        # matching build root and is sized well below the other agents.
        resources:
          limits:
            cpu: 400m
            memory: 1Gi
          requests:
            cpu: 25m
            memory: 384Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /git-repos
          name: mcp-server-git-repos
        - mountPath: /home/beeai/rhel-config.json
          name: rhel-config
          subPath: rhel-config.json
        - mountPath: /etc/secrets/jotnar-vertex-prod.json
          name: vertex-key
          subPath: jotnar-vertex-prod.json
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Matches the other agents: run_task_loop re-pushes in-flight tasks to
      # Redis on SIGTERM, so the pod needs a moment to wind down cleanly. A
      # task that was waiting on CI is simply re-polled after the rollout.
      terminationGracePeriodSeconds: 45
      volumes:
      - name: mcp-server-git-repos
        persistentVolumeClaim:
          claimName: mcp-server-git-repos
      - name: rhel-config
        configMap:
          name: rhel-config
      - name: vertex-key
        secret:
          secretName: vertex-key #pragma: allowlist secret
