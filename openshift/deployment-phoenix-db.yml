apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix-db
  annotations:
    image.openshift.io/triggers: |
      [
        {
          "from": {
            "kind": "ImageStreamTag",
            "name": "phoenix-db:prod"
          },
          "fieldPath": "spec.template.spec.containers[?(@.name==\"phoenix-db\")].image"
        }
      ]
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: phoenix-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: phoenix-db
        deployment: phoenix-db
    spec:
      initContainers:
      - name: setup-tls
        image: phoenix-db:prod
        command:
        - /bin/sh
        - -c
        - |
          cp /tls-secret/tls.crt /pg-tls/server.crt
          cp /tls-secret/tls.key /pg-tls/server.key
          chmod 0600 /pg-tls/server.key
          cat > /pg-tls/ssl.conf << 'CONF'
          ssl = on
          ssl_cert_file = '/pg-tls/server.crt'
          ssl_key_file = '/pg-tls/server.key'
          CONF
        volumeMounts:
        - name: tls-secret
          mountPath: /tls-secret
          readOnly: true
        - name: pg-tls
          mountPath: /pg-tls
      containers:
      - envFrom:
        - secretRef:
            name: phoenix-db-env
        image: phoenix-db:prod
        imagePullPolicy: IfNotPresent
        name: phoenix-db
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: "500m"
            memory: 1Gi
          requests:
            cpu: "25m"
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/pgsql/data
          name: phoenix-db-data
        - mountPath: /pg-tls
          name: pg-tls
        - mountPath: /opt/app-root/src/postgresql-cfg/ssl.conf
          name: pg-tls
          subPath: ssl.conf
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: phoenix-db-data
        persistentVolumeClaim:
          claimName: phoenix-db-data
      - name: tls-secret
        secret:
          secretName: phoenix-db-tls  # pragma: allowlist secret
      - name: pg-tls
        emptyDir: {}
