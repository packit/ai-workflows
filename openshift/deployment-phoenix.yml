apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  annotations:
    image.openshift.io/triggers: |
      [
        {
          "from": {
            "kind": "ImageStreamTag",
            "name": "phoenix:prod"
          },
          "fieldPath": "spec.template.spec.containers[?(@.name==\"phoenix\")].image"
        }
      ]
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: phoenix
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: phoenix
        deployment: phoenix
    spec:
      containers:
      - env:
        - name: PHOENIX_WORKING_DIR
          value: /mnt/data
        - name: PHOENIX_PORT
          value: "6006"
        - name: PHOENIX_POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: phoenix-db-env
              key: POSTGRESQL_USER
        - name: PHOENIX_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: phoenix-db-env
              key: POSTGRESQL_PASSWORD
        - name: PHOENIX_POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: phoenix-db-env
              key: POSTGRESQL_DATABASE
        - name: PHOENIX_SQL_DATABASE_URL
          value: postgresql://$(PHOENIX_POSTGRES_USER):$(PHOENIX_POSTGRES_PASSWORD)@phoenix-db.jotnar-ymir--jotnar-ymir.svc/$(PHOENIX_POSTGRES_DB)?sslmode=verify-full&sslrootcert=/etc/pki/service-ca/service-ca.crt
        - name: PHOENIX_MIGRATE_INDEX_CONCURRENTLY
          value: "true"
        image: phoenix:prod
        imagePullPolicy: IfNotPresent
        name: phoenix
        ports:
        - containerPort: 4317
          protocol: TCP
        - containerPort: 6006
          protocol: TCP
        - containerPort: 9090
          protocol: TCP
        resources:
          limits:
            cpu: "500m"
            memory: 768Mi
          requests:
            cpu: "25m"
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /mnt/data
          name: phoenix-data
        - mountPath: /etc/pki/service-ca
          name: service-ca
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: phoenix-data
        persistentVolumeClaim:
          claimName: phoenix-data
      - name: service-ca
        configMap:
          name: service-ca-bundle
