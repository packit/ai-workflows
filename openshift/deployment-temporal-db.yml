apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-db
  annotations:
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"temporal:postgres"},"fieldPath":"spec.template.spec.containers[?(@.name==\"postgres\")].image"}]
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal-db
  template:
    metadata:
      labels:
        app: temporal-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: temporal:postgres
          env:
            - name: POSTGRESQL_USER
              value: temporal
            - name: POSTGRESQL_DATABASE
              value: temporal
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-db
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "temporal", "-d", "temporal_visibility"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: init
              mountPath: /opt/app-root/src/postgresql-start/visibility.sh
              subPath: visibility.sh
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: temporal-db-data
        - name: init
          configMap:
            name: temporal-db-init
