apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-agent-sustaining
spec:
  progressDeadlineSeconds: 600
  # Target replicas when enabling the SE merge: 1.
  replicas: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: triage-agent-sustaining
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: triage-agent-sustaining
        deployment: triage-agent-sustaining
        billing-bucket: sustaining
        workload: triage
        rhel-major: all
    spec:
      containers:
      - args:
        - /usr/bin/python3
        - -m
        - ymir.agents.triage_agent
        env:
        # Deployment-scoped bucket: input and downstream queues come from the
        # *_sustaining family (see ymir/common/constants.py).
        - name: SUSTAINING
          value: "true"
        # The reproducer is not used for sustaining yet (section 4 of the plan).
        - name: TRIAGE_ENQUEUE_REPRODUCER
          value: "false"
        - name: REQUESTS_CA_BUNDLE
          value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
        - name: OPENINFERENCE_HIDE_INPUT_MESSAGES
          value: "true"
        envFrom:
        - configMapRef:
            name: agents-env
        - configMapRef:
            name: agents-env-sustaining
        - configMapRef:
            name: chat-env
        # Overrides chat-env: sustaining Vertex credential and GCP project.
        - configMapRef:
            name: chat-env-sustaining
        - configMapRef:
            name: endpoints-env
        - secretRef:
            name: sentry-env

        image: 'beeai-agent:c10s'
        imagePullPolicy: IfNotPresent
        name: triage-agent-sustaining
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          limits:
            cpu: 600m
            memory: 4Gi
          requests:
            cpu: 60m
            memory: 2Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /git-repos  # NOTE: This path must match GIT_REPO_BASEPATH in configmap/agents-env
          name: mcp-server-git-repos
        - mountPath: /home/beeai/rhel-config.json
          name: rhel-config
          subPath: rhel-config.json
        - mountPath: /etc/secrets/jotnar-vertex-sustaining.json
          name: vertex-key-sustaining
          subPath: jotnar-vertex-sustaining.json
        - mountPath: /etc/pki/service-ca
          name: service-ca
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        supplementalGroups:
        - 99
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 90
      volumes:
      - name: mcp-server-git-repos
        persistentVolumeClaim:
          claimName: mcp-server-git-repos
      - name: rhel-config
        configMap:
          name: rhel-config
      - name: vertex-key-sustaining
        secret:
          secretName: vertex-key-sustaining #pragma: allowlist secret
      - name: service-ca
        configMap:
          name: service-ca-bundle
