apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: valkey
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: valkey
        deployment: valkey
    spec:
      containers:
      - args:
        - --tls-port
        - "6379"
        - --port
        - "0"
        - --tls-cert-file
        - /tls/tls.crt
        - --tls-key-file
        - /tls/tls.key
        - --tls-ca-cert-file
        - /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        image: valkey:prod
        imagePullPolicy: IfNotPresent
        name: valkey
        ports:
        - containerPort: 6379
          protocol: TCP
        resources:
          limits:
            cpu: "200m"
            memory: 512Mi
          requests:
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: valkey-data
        - mountPath: /tls
          name: tls
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: valkey-data
        persistentVolumeClaim:
          claimName: valkey-data
      - name: tls
        secret:
          secretName: valkey-tls  # pragma: allowlist secret
