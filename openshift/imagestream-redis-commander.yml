apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: redis-commander
spec:
  tags:
    - name: prod
      from:
        kind: DockerImage
        name: quay.io/jotnar/redis-commander@sha256:4143a32885b1ae81feea8080a423aab9127cdf4fd8cb13a1b8c2a48002159f97
      importPolicy:
        # Keep the migration image reference immutable.
