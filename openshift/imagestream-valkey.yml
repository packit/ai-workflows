apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: valkey
spec:
  tags:
    - name: prod
      from:
        kind: DockerImage
        name: docker.io/valkey/valkey@sha256:0f62bfecc0b713dc2111af3ee307d5cd53c6877b7a112c6143c4de20f1325e4c
      importPolicy:
        # Keep the migration image reference immutable.
        scheduled: false
  lookupPolicy:
    # allows all resources pointing to this image stream to use it in the image field
    local: true
