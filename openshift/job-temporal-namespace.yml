apiVersion: batch/v1
kind: Job
metadata:
  generateName: temporal-namespace-
spec:
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: namespace
          image: temporal:admin-tools
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if ! temporal operator namespace describe; then
                temporal operator namespace create --retention 7d || temporal operator namespace describe
              fi
          envFrom:
            - configMapRef:
                name: temporal-triage-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
