apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: 8080-tcp
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: api
    deployment: api
  sessionAffinity: None
  type: ClusterIP
