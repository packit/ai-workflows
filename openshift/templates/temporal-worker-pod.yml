apiVersion: v1
kind: Pod
spec:
  automountServiceAccountToken: false
  restartPolicy: OnFailure
  terminationGracePeriodSeconds: 25
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: worker
      envFrom:
        - configMapRef:
            name: agents-env
        - configMapRef:
            name: chat-env
        - configMapRef:
            name: endpoints-env
        - secretRef:
            name: sentry-env
      env:
        - name: REQUESTS_CA_BUNDLE
          value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
        - name: OPENINFERENCE_HIDE_INPUT_MESSAGES
          value: "true"
      readinessProbe:
        exec:
          command: ["test", "-f", "/git-repos/.temporal-worker-ready"]
        periodSeconds: 3
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 60m
          memory: 2Gi
        limits:
          cpu: 600m
          memory: 4Gi
      volumeMounts:
        - name: workspace
          mountPath: /git-repos
        - name: rhel-config
          mountPath: /home/beeai/rhel-config.json
          subPath: rhel-config.json
          readOnly: true
        - name: vertex-key
          mountPath: /etc/secrets/jotnar-vertex-prod.json
          subPath: jotnar-vertex-prod.json
          readOnly: true
        - name: service-ca
          mountPath: /etc/pki/service-ca
          readOnly: true
    - name: gateway
      image: mcp-server:prod
      command: ["/opt/beeai-venv/bin/python", "-m", "ymir.tools.privileged.gateway"]
      envFrom:
        - secretRef:
            name: gitlab-env
        - secretRef:
            name: github-readonly-env
        - configMapRef:
            name: jira-env
        - secretRef:
            name: jira-env
        - configMapRef:
            name: kerberos-env
      env:
        - name: SSE_PORT
          value: "8000"
        - name: KRB5CCNAME
          value: FILE:/tmp/krb5cc
        - name: REQUESTS_CA_BUNDLE
          value: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
        - name: BUILD_BACKEND
          value: konflux
        - name: KONFLUX_API_URL
          value: https://api.kflux-rhel-p01.fc38.p1.openshiftapps.com:6443
        - name: KUBEARCHIVE_API_URL
          value: https://kubearchive-api-server-product-kubearchive.apps.kflux-rhel-p01.fc38.p1.openshiftapps.com
        - name: KONFLUX_PIPELINE_URL
          value: https://gitlab.cee.redhat.com/rhel-on-konflux/rpmbuild-pipeline.git
        - name: KONFLUX_TOKEN_FILE
          value: /home/mcp/konflux/token
        - name: FORK_NAMESPACE
          value: redhat/rhel/bot-branches
      readinessProbe:
        exec:
          command:
            - /opt/beeai-venv/bin/python
            - -c
            - import socket; socket.create_connection(("127.0.0.1", 8000), timeout=1).close()
        periodSeconds: 3
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 20m
          memory: 1Gi
        limits:
          cpu: 200m
          memory: 2Gi
      volumeMounts:
        - name: workspace
          mountPath: /git-repos
        - name: rhel-config
          mountPath: /home/mcp/rhel-config.json
          subPath: rhel-config.json
          readOnly: true
        - name: keytab
          mountPath: /etc/secrets/redhat-ymir-agent.keytab
          subPath: redhat-ymir-agent.keytab
          readOnly: true
        - name: konflux-token
          mountPath: /home/mcp/konflux
          readOnly: true
  volumes:
    - name: workspace
      emptyDir: {}
    - name: rhel-config
      configMap:
        name: rhel-config
    - name: service-ca
      configMap:
        name: service-ca-bundle
    - name: vertex-key
      secret:
        secretName: vertex-key  # pragma: allowlist secret
    - name: keytab
      secret:
        secretName: redhat-ymir-agent-keytab  # pragma: allowlist secret
    - name: konflux-token
      secret:
        secretName: konflux-bot-0-token  # pragma: allowlist secret
